<!DOCTYPE html>
{% load static %}
<html>
<head>
	<title>Profile</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
	<style>
		.profile-card {
			box-shadow: 0 0 10px rgba(196, 36, 36, 0.1);
			border-radius: 30px;
			padding: 20px;
			margin: 20px;
			background-color: #e45d5d;
		}
		.profile-card {
  			background: linear-gradient(to bottom, orange, #a39e9a);
		}
		.profile-card {
  			border: 10px solid #0e0d0d;
  			border-top: 10px solid #080808;
  			border-bottom: 10px solid #080808;
		}
		.profile-photo {
			width: 100px;
			height: 100px;
			border-radius: 10%;
			margin: 10px;
		}
		.profile-info {
			margin-top: 20px;
		}
		.profile-info label {
			font-weight: bold;
			margin-right: 10px;
		}
	</style>
</head>
<body>
	<div class="container">
		<div class="row">
			<div class="col-md-4 offset-md-4">
				<div class="card profile-card">
					<img src="{% static 'media/profile_photo.png' %}" class="profile_photo" alt="profile-photo">
					<div class="card-body">
						<center><h5 class="card-title">My Card</h5></center>
						<div class="profile-info">
							<label>Name:</label>
							<p>Pavan</p>
							<label>Age:</label>
							<p>23</p>
							<label>Linkedin:</label>
							<p><a href="https://www.linkedin.com/in/pavan-kalyan/" target="_blank">Linkedin.pavan@</a></p>	
							<label>Phone Number:</label>
							<p>9912321090</p>
							<label>Address:</label>
							<p>Karimnagar</p>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
